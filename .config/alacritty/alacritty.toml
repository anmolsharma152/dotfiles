[general]
import = [
  "~/.config/alacritty/dank-theme.toml"
]

[terminal.shell]
program = "/usr/bin/fish"

[window]
padding = { x = 4, y = 4 }
# decorations = "None"
opacity = 0.95
dynamic_padding = false
startup_mode = "Windowed"

# Sets the initial window size (columns x lines)
[window.dimensions]
columns = 100
lines = 28

[font]
normal = { family = "MesloLGS Nerd Font", style = "Regular" }
bold = { family = "MesloLGS Nerd Font", style = "Bold" }
italic = { family = "MesloLGS Nerd Font", style = "Italic" }
size = 14.0

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[bell]
duration = 0

[keyboard]
bindings = [
  { key = "C",       mods = "Control|Shift", action = "Copy"  },
  { key = "V",       mods = "Control|Shift", action = "Paste" },
  { key = "T",       mods = "Control|Shift", action = "CreateNewWindow" },
  { key = "W",       mods = "Control|Shift", action = "Quit" },
  { key = "N",       mods = "Control|Shift", action = "CreateNewWindow" },
  { key = "Equals",  mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Control",       action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Control",       action = "ResetFontSize"    },
  { key = "Enter",   mods = "Shift",         chars = "\n" },
]
